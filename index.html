<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Edoardo Parigi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #d56c1d;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      overflow: hidden;
      background: #d56c1d;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transform: scale(1.015);
    }

    .top-text,
    .name,
    .button {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: block;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .top-text {
      top: calc(var(--safe-top) + 11.5dvh);
      width: min(43vw, 330px);
      min-width: 160px;
    }

    .name {
      top: 39.5dvh;
      width: min(74vw, 560px);
      min-width: 255px;
    }

    .cta {
      position: absolute;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 10.5dvh);
      transform: translateX(-50%);
      width: min(64vw, 380px);
      min-width: 220px;
      display: block;
      border-radius: 999px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 180ms ease, filter 180ms ease;
      will-change: transform;
    }

    .cta .button {
      position: static;
      width: 100%;
      transform: none;
      filter: drop-shadow(0 0 24px rgba(255,255,255,0.44));
    }

    .cta:hover,
    .cta:focus-visible {
      transform: translateX(-50%) translateY(-2px) scale(1.012);
      filter: brightness(1.02);
      outline: none;
    }

    .cta:active {
      transform: translateX(-50%) translateY(1px) scale(0.992);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 390px) {
      .top-text {
        top: calc(var(--safe-top) + 10dvh);
        width: min(48vw, 250px);
        min-width: 150px;
      }

      .name {
        top: 41dvh;
        width: min(80vw, 420px);
        min-width: 240px;
      }

      .cta {
        bottom: calc(var(--safe-bottom) + 8.5dvh);
        width: min(71vw, 310px);
        min-width: 210px;
      }
    }

    @media (min-width: 430px) {
      .top-text {
        top: calc(var(--safe-top) + 12dvh);
        width: min(35vw, 290px);
      }

      .name {
        top: 38.5dvh;
        width: min(60vw, 500px);
      }

      .cta {
        bottom: calc(var(--safe-bottom) + 11.5dvh);
        width: min(52vw, 340px);
      }
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="Pagina contatto Edoardo Parigi full screen per telefono">
    <img class="bg" src="./assets/sfondo-2.jpg" alt="" aria-hidden="true" />
    <img class="top-text" src="./assets/testo-top-4.svg" alt="Questo è di:" />
    <img class="name" src="./assets/nome.svg" alt="Edoardo Parigi" />
    <a class="cta" href="tel:+393338188793" aria-label="Chiama Edoardo Parigi al numero +39 333 8188793">
      <span class="sr-only">Chiama Edoardo Parigi</span>
      <img class="button" src="./assets/pulsante-3.svg" alt="Chiamalo!" />
    </a>
  </main>
</body>
</html>
