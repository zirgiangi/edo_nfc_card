<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Edoardo Parigi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --content-x: clamp(18px, 4.5vw, 28px);
      --top-buffer: clamp(14px, 2.6vh, 24px);
      --bottom-buffer: clamp(14px, 2.8vh, 28px);
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #d56c1d;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .screen {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      overflow: hidden;
      background: #d56c1d;
      padding:
        calc(var(--sat) + var(--top-buffer))
        calc(var(--sar) + var(--content-x))
        calc(var(--sab) + var(--bottom-buffer))
        calc(var(--sal) + var(--content-x));
      isolation: isolate;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.02);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: calc(100dvh - var(--sat) - var(--sab) - var(--top-buffer) - var(--bottom-buffer));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .top-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: clamp(4px, 1vh, 10px);
    }

    .top-text,
    .name,
    .button {
      display: block;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      image-rendering: auto;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .top-text {
      width: clamp(160px, 44vw, 300px);
      max-width: 72%;
    }

    .center-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: clamp(28px, 7vh, 88px);
      padding-bottom: clamp(28px, 7vh, 88px);
    }

    .name {
      width: clamp(255px, 74vw, 620px);
      max-width: 100%;
    }

    .bottom-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-bottom: max(0px, var(--sab));
    }

    .cta {
      display: block;
      width: clamp(220px, 63vw, 390px);
      max-width: 86%;
      border-radius: 999px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 180ms ease, filter 180ms ease;
      will-change: transform;
    }

    .button {
      width: 100%;
      filter: drop-shadow(0 0 24px rgba(255,255,255,0.44));
    }

    .cta:hover,
    .cta:focus-visible {
      transform: translateY(-2px) scale(1.012);
      filter: brightness(1.02);
      outline: none;
    }

    .cta:active {
      transform: translateY(1px) scale(0.992);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @supports (-webkit-touch-callout: none) {
      .top-text,
      .name,
      .button {
        opacity: 1;
        filter: none;
      }

      .button {
        filter: drop-shadow(0 0 24px rgba(255,255,255,0.44));
      }
    }

    @supports not (-webkit-touch-callout: none) {
      .top-text,
      .name,
      .button {
        filter: brightness(0) invert(1);
      }

      .button {
        filter: brightness(0) invert(1) drop-shadow(0 0 24px rgba(255,255,255,0.44));
      }
    }

    @media (max-width: 390px) {
      .screen {
        padding-top: calc(var(--sat) + clamp(12px, 2vh, 18px));
        padding-bottom: calc(var(--sab) + clamp(12px, 2.4vh, 20px));
      }

      .top-text {
        width: clamp(150px, 48vw, 220px);
        max-width: 80%;
      }

      .name {
        width: clamp(240px, 81vw, 390px);
      }

      .cta {
        width: clamp(210px, 72vw, 310px);
      }
    }

    @media (min-width: 430px) {
      .top-text {
        width: clamp(170px, 34vw, 280px);
      }

      .name {
        width: clamp(280px, 60vw, 520px);
      }

      .cta {
        width: clamp(230px, 52vw, 340px);
      }
    }

    @media (max-height: 740px) {
      .center-wrap {
        padding-top: clamp(18px, 4vh, 44px);
        padding-bottom: clamp(18px, 4vh, 44px);
      }
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="Pagina contatto Edoardo Parigi full screen ottimizzata per iPhone e Android">
    <img class="bg" src="./assets/sfondo-2.jpg" alt="" aria-hidden="true" />

    <section class="content">
      <div class="top-wrap">
        <img class="top-text" src="./assets/testo-top-4.svg" alt="Questo è di:" />
      </div>

      <div class="center-wrap">
        <img class="name" src="./assets/nome.svg" alt="Edoardo Parigi" />
      </div>

      <div class="bottom-wrap">
        <a class="cta" href="tel:+393338188793" aria-label="Chiama Edoardo Parigi al numero +39 333 8188793">
          <span class="sr-only">Chiama Edoardo Parigi</span>
          <img class="button" src="./assets/pulsante-3.svg" alt="Chiamalo!" />
        </a>
      </div>
    </section>
  </main>
</body>
</html>
