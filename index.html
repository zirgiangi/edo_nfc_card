<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Edoardo Parigi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --safe-top: max(env(safe-area-inset-top), 12px);
      --safe-bottom: max(env(safe-area-inset-bottom), 12px);
      --safe-left: max(env(safe-area-inset-left), 12px);
      --safe-right: max(env(safe-area-inset-right), 12px);
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #1b120a;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .poster {
      position: relative;
      width: min(100vw, calc(100svh * 9 / 16));
      height: min(100svh, calc(100vw * 16 / 9));
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #d5671f;
      isolation: isolate;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.01);
    }

    .top-text,
    .name,
    .button {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: block;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .top-text {
      top: clamp(8.8%, calc(var(--safe-top) + 4.6%), 14.4%);
      width: clamp(36%, 40vw, 44%);
      max-width: 340px;
      min-width: 170px;
    }

    .name {
      top: 39.2%;
      width: clamp(62%, 69vw, 74%);
      max-width: 610px;
      min-width: 260px;
    }

    .cta {
      position: absolute;
      left: 50%;
      bottom: clamp(calc(var(--safe-bottom) + 5.2%), 11.5%, 15.5%);
      transform: translateX(-50%);
      width: clamp(52%, 62vw, 68%);
      max-width: 420px;
      min-width: 220px;
      display: block;
      border-radius: 999px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 180ms ease, filter 180ms ease;
      will-change: transform;
    }

    .cta .button {
      position: static;
      width: 100%;
      transform: none;
      left: auto;
      top: auto;
      filter: drop-shadow(0 0 22px rgba(255,255,255,0.42));
    }

    .cta:hover,
    .cta:focus-visible {
      transform: translateX(-50%) translateY(-2px) scale(1.012);
      filter: brightness(1.02);
      outline: none;
    }

    .cta:active {
      transform: translateX(-50%) translateY(1px) scale(0.992);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 390px) {
      .top-text {
        top: clamp(9.6%, calc(var(--safe-top) + 4.8%), 15.2%);
        width: clamp(40%, 43vw, 48%);
      }

      .name {
        top: 40.6%;
        width: clamp(68%, 74vw, 78%);
      }

      .cta {
        bottom: clamp(calc(var(--safe-bottom) + 5%), 10.2%, 13.4%);
        width: clamp(58%, 68vw, 74%);
      }
    }

    @media (min-width: 430px) and (max-width: 600px) {
      .top-text { width: clamp(31%, 35vw, 37%); }
      .name { width: clamp(56%, 62vw, 66%); }
      .cta { width: clamp(46%, 54vw, 58%); }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="Pagina contatto Edoardo Parigi in formato 9:16 responsive per telefono">
    <img class="bg" src="./assets/sfondo-2.jpg" alt="" aria-hidden="true" />
    <img class="top-text" src="./assets/testo-top-4.svg" alt="Questo è di:" />
    <img class="name" src="./assets/nome.svg" alt="Edoardo Parigi" />
    <a class="cta" href="tel:+393338188793" aria-label="Chiama Edoardo Parigi al numero +39 333 8188793">
      <span class="sr-only">Chiama Edoardo Parigi</span>
      <img class="button" src="./assets/pulsante-3.svg" alt="Chiamalo!" />
    </a>
  </main>
</body>
</html>
