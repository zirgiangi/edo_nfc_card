<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edoardo Parigi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1b120a;
      font-family: Arial, sans-serif;
    }
    .poster {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #d5671f;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .top-text,
    .name,
    .button {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: block;
      max-width: none;
    }
    .top-text {
      top: 14.7%;
      width: 37.8%;
    }
    .name {
      top: 38.9%;
      width: 64.9%;
    }
    .cta {
      position: absolute;
      left: 50%;
      top: 73.3%;
      transform: translateX(-50%);
      width: 53.5%;
      display: block;
      border-radius: 999px;
      text-decoration: none;
      transition: transform 180ms ease, filter 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .cta .button {
      position: static;
      width: 100%;
      transform: none;
      left: auto;
      top: auto;
      filter: drop-shadow(0 0 18px rgba(255,255,255,0.42));
    }
    .cta:hover,
    .cta:focus-visible {
      transform: translateX(-50%) translateY(-2px) scale(1.01);
      filter: brightness(1.02);
      outline: none;
    }
    .cta:active {
      transform: translateX(-50%) translateY(1px) scale(0.995);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="Pagina contatto Edoardo Parigi in formato 9:16">
    <img class="bg" src="./assets/sfondo-2.jpg" alt="" aria-hidden="true" />
    <img class="top-text" src="./assets/testo-top-4.svg" alt="Questo è di:" />
    <img class="name" src="./assets/nome.svg" alt="Edoardo Parigi" />
    <a class="cta" href="tel:+393338188793" aria-label="Chiama Edoardo Parigi al numero +39 333 8188793">
      <span class="sr-only">Chiama Edoardo Parigi</span>
      <img class="button" src="./assets/pulsante-3.svg" alt="Chiamalo!" />
    </a>
  </main>
</body>
</html>
